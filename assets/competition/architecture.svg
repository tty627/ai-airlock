<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Airlock architecture</title>
  <desc id="desc">Private Zone flows through Detect, Transform and Isolate, OpenVINO Relevance, and Safe Context Capsule. Only the Capsule crosses into the Agent Zone. Qoder host acceptance is pending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061321"/>
      <stop offset="1" stop-color="#0b263c"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d0e7"/>
      <stop offset="1" stop-color="#54d19c"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020911" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#25d0e7"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#6d91a7"/>
    </marker>
    <style>
      .sans{font-family:Noto-Sans-CJK-SC,Arial-Unicode-MS,Arial,sans-serif}
      .mono{font-family:JetBrains-Mono,monospace}
      .label{font-size:18px;font-weight:700;letter-spacing:1.5px}
      .title{font-size:29px;font-weight:760}
      .body{font-size:18px}
      .small{font-size:15px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#071a2b"/>
  <g class="sans">
    <text x="76" y="82" fill="#eaf7ff" font-size="42" font-weight="800">The Airlock-controlled boundary</text>
    <text x="76" y="124" fill="#92aec1" font-size="21">Raw content stays in the Private Zone. Only the Safe Context Capsule crosses.</text>

    <rect x="58" y="164" width="1160" height="630" rx="34" fill="#081b2c" stroke="#1e526e" stroke-width="2"/>
    <rect x="1248" y="164" width="294" height="630" rx="34" fill="#102235" stroke="#ff8a3d" stroke-width="2"/>
    <text x="94" y="212" fill="#78e6f2" class="label">PRIVATE ZONE · LOCAL MACHINE</text>
    <text x="1278" y="212" fill="#ffb27f" class="label">AGENT ZONE</text>
    <line x1="1233" y1="186" x2="1233" y2="770" stroke="#ff8a3d" stroke-width="4" stroke-dasharray="12 14"/>
    <rect x="1102" y="108" width="262" height="42" rx="21" fill="#3a281f" stroke="#ff8a3d"/>
    <text x="1233" y="136" fill="#ffd1b2" font-size="17" font-weight="700" text-anchor="middle">AIRLOCK BOUNDARY</text>

    <g transform="translate(94 318)" filter="url(#shadow)">
      <rect width="210" height="260" rx="24" fill="#102a40" stroke="#31556d" stroke-width="2"/>
      <path d="M52 50h106l28 28v117H52z" fill="#0b1f32" stroke="#6d91a7" stroke-width="2"/>
      <path d="M158 50v30h28" fill="none" stroke="#6d91a7" stroke-width="2"/>
      <rect x="72" y="98" width="92" height="10" rx="5" fill="#486a7f"/>
      <rect x="72" y="126" width="72" height="10" rx="5" fill="#ff8a3d" opacity="0.9"/>
      <rect x="72" y="154" width="92" height="10" rx="5" fill="#486a7f"/>
      <text x="105" y="222" fill="#eaf7ff" class="title" text-anchor="middle">Raw files</text>
      <text x="105" y="248" fill="#ffb27f" class="small" text-anchor="middle">private · untrusted</text>
    </g>

    <g transform="translate(358 280)" filter="url(#shadow)">
      <rect width="220" height="336" rx="28" fill="#0d2b42" stroke="#25d0e7" stroke-width="2"/>
      <circle cx="110" cy="78" r="43" fill="#123d53" stroke="#25d0e7" stroke-width="3"/>
      <path d="M88 78l15 15 31-34" fill="none" stroke="#54d19c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="160" fill="#eaf7ff" class="title" text-anchor="middle">Detect</text>
      <text x="110" y="202" fill="#92aec1" class="body" text-anchor="middle">Secret · PII</text>
      <text x="110" y="232" fill="#ffb27f" class="body" text-anchor="middle">Prompt Injection</text>
      <line x1="42" y1="264" x2="178" y2="264" stroke="#31556d"/>
      <text x="110" y="294" fill="#78e6f2" class="small" text-anchor="middle">full-corpus first</text>
    </g>

    <g transform="translate(626 280)" filter="url(#shadow)">
      <rect width="246" height="336" rx="28" fill="#0d2b42" stroke="#25d0e7" stroke-width="2"/>
      <rect x="72" y="37" width="102" height="80" rx="14" fill="#123d53" stroke="#25d0e7" stroke-width="3"/>
      <path d="M96 74h54" stroke="#ff8a3d" stroke-width="9" stroke-linecap="round"/>
      <path d="M108 94h30" stroke="#54d19c" stroke-width="9" stroke-linecap="round"/>
      <text x="123" y="160" fill="#eaf7ff" class="title" text-anchor="middle">Transform</text>
      <text x="123" y="196" fill="#eaf7ff" font-size="24" font-weight="700" text-anchor="middle">&amp; Isolate</text>
      <text x="123" y="236" fill="#92aec1" class="body" text-anchor="middle">redact · pseudonymize</text>
      <text x="123" y="266" fill="#ffb27f" class="body" text-anchor="middle">quarantine instructions</text>
      <line x1="52" y1="290" x2="194" y2="290" stroke="#31556d"/>
      <text x="123" y="317" fill="#78e6f2" class="small" text-anchor="middle">before model input</text>
    </g>

    <g transform="translate(920 280)" filter="url(#shadow)">
      <rect width="242" height="336" rx="28" fill="#0d2b42" stroke="#25d0e7" stroke-width="2"/>
      <circle cx="121" cy="78" r="48" fill="#123d53" stroke="#25d0e7" stroke-width="3"/>
      <circle cx="102" cy="69" r="8" fill="#54d19c"/>
      <circle cx="139" cy="60" r="8" fill="#25d0e7"/>
      <circle cx="137" cy="95" r="8" fill="#ff8a3d"/>
      <path d="M108 68l24-6M108 73l23 18" stroke="#92aec1" stroke-width="4"/>
      <text x="121" y="160" fill="#eaf7ff" class="title" text-anchor="middle">OpenVINO</text>
      <text x="121" y="196" fill="#eaf7ff" font-size="24" font-weight="700" text-anchor="middle">Relevance</text>
      <text x="121" y="236" fill="#92aec1" class="body" text-anchor="middle">task-conditioned ranking</text>
      <text x="121" y="266" fill="#78e6f2" class="body" text-anchor="middle">transformed text only</text>
      <line x1="48" y1="290" x2="194" y2="290" stroke="#31556d"/>
      <text x="121" y="317" fill="#54d19c" class="small" text-anchor="middle">Mac / CPU verified</text>
    </g>

    <line x1="304" y1="448" x2="340" y2="448" stroke="#6d91a7" stroke-width="5"/>
    <path d="M340 440l12 8-12 8z" fill="#6d91a7"/>
    <line x1="578" y1="448" x2="608" y2="448" stroke="#6d91a7" stroke-width="5"/>
    <path d="M608 440l12 8-12 8z" fill="#6d91a7"/>
    <line x1="872" y1="448" x2="902" y2="448" stroke="#6d91a7" stroke-width="5"/>
    <path d="M902 440l12 8-12 8z" fill="#6d91a7"/>

    <g transform="translate(892 670)">
      <rect width="300" height="84" rx="42" fill="#25d0e7" stroke="#eaf7ff" stroke-width="3" filter="url(#shadow)"/>
      <text x="150" y="38" fill="#071525" font-size="22" font-weight="850" text-anchor="middle">SAFE CONTEXT CAPSULE</text>
      <text x="150" y="64" fill="#0b3340" class="small" text-anchor="middle">facts · provenance · decision · leak gate</text>
    </g>
    <path d="M1040 616v39" stroke="#25d0e7" stroke-width="5"/>
    <path d="M1032 655l8 12 8-12z" fill="#25d0e7"/>

    <path d="M1192 712h78" stroke="#25d0e7" stroke-width="7"/>
    <path d="M1270 702l14 10-14 10z" fill="#25d0e7"/>
    <rect x="1120" y="806" width="230" height="38" rx="19" fill="#0d3444" stroke="#25d0e7"/>
    <text x="1235" y="832" fill="#bdeff5" font-size="16" font-weight="700" text-anchor="middle">ONLY CAPSULE CROSSES</text>

    <g transform="translate(1280 324)" filter="url(#shadow)">
      <rect width="230" height="280" rx="28" fill="#132c42" stroke="#ff8a3d" stroke-width="2"/>
      <circle cx="115" cy="76" r="50" fill="#0b1f32" stroke="#25d0e7" stroke-width="3"/>
      <circle cx="115" cy="62" r="15" fill="#bdeff5"/>
      <path d="M82 102c9-27 57-27 66 0" fill="#bdeff5"/>
      <text x="115" y="158" fill="#eaf7ff" class="title" text-anchor="middle">Qoder / Agent</text>
      <rect x="18" y="184" width="194" height="43" rx="21" fill="#3b281f" stroke="#ff8a3d"/>
      <text x="115" y="212" fill="#ffd1b2" font-size="14" font-weight="760" text-anchor="middle">HOST ACCEPTANCE</text>
      <text x="115" y="252" fill="#ffb27f" class="body" font-weight="750" text-anchor="middle">PENDING</text>
    </g>
    <text x="1395" y="642" fill="#92aec1" class="small" text-anchor="middle">Capsule-only non-bypass</text>
    <text x="1395" y="666" fill="#92aec1" class="small" text-anchor="middle">requires real host evidence</text>

    <rect x="94" y="676" width="694" height="79" rx="18" fill="#0c2639" stroke="#31556d"/>
    <text x="122" y="710" fill="#78e6f2" font-size="16" font-weight="750">CURRENT EVIDENCE</text>
    <text x="122" y="739" fill="#b7ccda" font-size="17">macOS · Apple M4 CPU · OpenVINO path verified · Windows/Qoder pending</text>
  </g>
</svg>
