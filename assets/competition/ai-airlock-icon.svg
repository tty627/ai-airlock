    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d0e7"/>
      <stop offset="1" stop-color="#54d19c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
