      <rect y="184" width="166" height="68" rx="14" fill="#102f45" stroke="#25d0e7"/>
      <text x="83" y="211" fill="#bdeff5" font-size="16" text-anchor="middle" font-weight="700">OPENVINO</text>
      <text x="83" y="234" fill="#92aec1" font-size="14" text-anchor="middle">task relevance</text>
      <path d="M83 252v12" stroke="#25d0e7" stroke-width="3"/>
      <rect y="264" width="166" height="48" rx="14" fill="#102f45" stroke="#25d0e7"/>
      <text x="83" y="294" fill="#bdeff5" font-size="15" text-anchor="middle" font-weight="700">FINAL LEAK GATE</text>
