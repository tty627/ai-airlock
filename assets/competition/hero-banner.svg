<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Airlock — Your data stays. Your Agent works.</title>
  <desc id="desc">Hero banner showing an Airlock-controlled path that transforms private data into a budgeted, policy-filtered Safe Context Capsule; real host non-bypass remains pending.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061321"/>
      <stop offset="0.55" stop-color="#0a2034"/>
      <stop offset="100%" stop-color="#0d2f49"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25d0e7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#25d0e7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25d0e7"/>
      <stop offset="100%" stop-color="#54d19c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020911" flood-opacity="0.52"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:Noto-Sans-CJK-SC,Arial-Unicode-MS,Arial,sans-serif}
      .mono{font-family:JetBrains-Mono,monospace}
