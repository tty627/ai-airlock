  <circle cx="930" cy="840" r="380" fill="#0d4053" opacity="0.14"/>
  <path d="M0 748C330 665 496 856 820 780c294-69 486-229 780-160v280H0z" fill="#08192a" opacity="0.82"/>

  <g class="sans">
