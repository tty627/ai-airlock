    <path d="M514 510h52" stroke="#25d0e7" stroke-width="5"/>
    <path d="M558 499l17 11-17 11z" fill="#25d0e7"/>
    <g transform="translate(520 376)" class="sans">
      <circle cx="48" cy="54" r="47" fill="#102a40" stroke="#25d0e7" stroke-width="3"/>
