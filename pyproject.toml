[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-airlock"
version = "0.1.0"
description = "Local compiler for budgeted, policy-filtered AI context capsules"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "谭天晔" }]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]
openvino = [
  "huggingface-hub==1.28.0",
  "numpy==2.5.2",
  "openvino==2026.3.1",
  "openvino-genai==2026.3.1.0",
  "openvino-tokenizers==2026.3.1.0",
  "tiktoken==0.14.0",
  "transformers[sentencepiece]==5.16.1",
]

[project.scripts]
ai-airlock = "airlock.cli:main"

[project.urls]
Homepage = "https://github.com/tty627/ai-airlock"
Repository = "https://github.com/tty627/ai-airlock"
Issues = "https://github.com/tty627/ai-airlock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
